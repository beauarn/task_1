<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenario 3: Table Layout (No Form-Group Classes or Explicit For/ID)</title>
    <style>
        table { border-collapse: collapse; width: 600px; margin: 30px auto; font-family: Arial; }
        td { padding: 10px; border: 1px solid #ccc; }
        .label-cell { font-weight: bold; background: #f9f9f9; width: 35%; }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="label-cell">First Name:</td>
            <td><input type="text" placeholder="Name"></td>
        </tr>
        <tr>
            <td class="label-cell">Gender:</td>
            <td>
                <input type="radio" name="sex_opt" value="Male"> Male
                &nbsp;&nbsp;
                <input type="radio" name="sex_opt" value="Female"> Female
            </td>
        </tr>
        <tr>
            <td class="label-cell">State:</td>
            <td>
                <select>
                    <option>Choose State</option>
                    <option value="United States">United States</option>
                    <option value="Ontario">Ontario</option>
                </select>
            </td>
        </tr>
    </table>
</body>
</html>
